version: '3.8'

services:
  python-metrics-ms:
    build: .
    container_name: python_metrics_ms
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres-db:5432/global_invoice
    networks:
      - global-invoice-net

networks:
  global-invoice-net:
    external: true