name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request_target:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag global-invoice-metrics:${{ github.sha }} .

      - name: Start container
        run: |
          docker run --detach --rm \
            --name global-invoice-metrics-ci \
            --publish 5000:5000 \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/global_invoice \
            --env JWT_SECRET=ci-secret \
            --env INTERNAL_API_KEY=ci-internal-key \
            global-invoice-metrics:${{ github.sha }}

      - name: Check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs global-invoice-metrics-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop global-invoice-metrics-ci || true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}