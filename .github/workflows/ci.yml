name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b7f8abb1508181956e8e162db938b08d1ad56ae # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build --tag global-invoice-metrics:${{ github.sha }} .

      - name: Start container
        run: |
          docker run --detach --rm \
            --name global-invoice-metrics-ci \
            --publish 5000:5000 \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/global_invoice \
            --env JWT_SECRET=ci-secret \
            --env INTERNAL_API_KEY=ci-internal-key \
            global-invoice-metrics:${{ github.sha }}

      - name: Check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs global-invoice-metrics-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop global-invoice-metrics-ci || true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@bfd4e069123896500ecdd0d4d23ff1e4d3a049d5 # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.MICRO_PYTHON }}